name: card

on:
  schedule:
    - cron: "7 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["assets/card-*.svg"]

permissions:
  contents: write

concurrency:
  group: card
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh
        run: python3 tools/update.py
        env:
          GH_TOKEN: ${{ secrets.CARD_TOKEN || github.token }}
          GH_LOGIN: ${{ github.repository_owner }}
      - name: Save
        run: |
          git config user.name "CoOwner"
          git config user.email "43219441+CoOwner@users.noreply.github.com"
          git add assets/card-dark.svg assets/card-light.svg
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
            git push --force
          fi
